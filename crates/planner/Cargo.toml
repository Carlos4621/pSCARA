[package]
name = "planner"
version = "0.1.0"
edition = "2024"

[features]
default = ["transition-estimation"]
transition-estimation = []
transition-hinted = ["transition-estimation"]
transition-hinted-noinline = ["transition-hinted"]
transition-inverse-cache = ["transition-hinted"]

[dependencies]
kinematics = { path = "../kinematics" }
libm = "0.2.16"
trajectory = { path = "../trajectory" }
utilities = { path = "../utilities" }
